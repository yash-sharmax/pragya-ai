<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pragya-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#d97706" />
      <stop offset="50%" stopColor="#b45309" />
      <stop offset="100%" stopColor="#0f172a" />
    </linearGradient>
    <linearGradient id="pragya-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef3c7" />
      <stop offset="35%" stopColor="#f59e0b" />
      <stop offset="70%" stopColor="#d97706" />
      <stop offset="100%" stopColor="#92400e" />
    </linearGradient>
    <linearGradient id="pragya-flame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="30%" stopColor="#fbbf24" />
      <stop offset="70%" stopColor="#f97316" />
      <stop offset="100%" stopColor="#dc2626" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="100" height="100" rx="22" fill="#090d16" />
  <rect x="1" y="1" width="98" height="98" rx="21" stroke="url(#pragya-gold)" stroke-width="2" opacity="0.6" />

  <!-- Quantum Orbits -->
  <circle cx="50" cy="50" r="38" stroke="url(#pragya-gold)" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.5" />
  <ellipse cx="50" cy="50" rx="36" ry="16" stroke="url(#pragya-gold)" stroke-width="1" opacity="0.45" transform="rotate(-30 50 50)" />
  <ellipse cx="50" cy="50" rx="36" ry="16" stroke="url(#pragya-gold)" stroke-width="1" opacity="0.45" transform="rotate(30 50 50)" />

  <!-- Computational Nodes -->
  <circle cx="78" cy="36" r="2.5" fill="#fde68a" />
  <circle cx="22" cy="64" r="2.5" fill="#fde68a" />

  <!-- 8-Fold Mandala Lotus Petals -->
  <g opacity="0.85">
    <path d="M50 24 C52 32 54 36 50 44 C46 36 48 32 50 24Z" fill="url(#pragya-gold)" />
    <path d="M50 76 C52 68 54 64 50 56 C46 64 48 68 50 76Z" fill="url(#pragya-gold)" />
    <path d="M24 50 C32 52 36 54 44 50 C36 46 32 48 24 50Z" fill="url(#pragya-gold)" />
    <path d="M76 50 C68 52 64 54 56 50 C64 46 68 48 76 50Z" fill="url(#pragya-gold)" />
    <g transform="rotate(45 50 50)">
      <path d="M50 24 C52 32 54 36 50 44 C46 36 48 32 50 24Z" fill="url(#pragya-gold)" opacity="0.8" />
      <path d="M50 76 C52 68 54 64 50 56 C46 64 48 68 50 76Z" fill="url(#pragya-gold)" opacity="0.8" />
      <path d="M24 50 C32 52 36 54 44 50 C36 46 32 48 24 50Z" fill="url(#pragya-gold)" opacity="0.8" />
      <path d="M76 50 C68 52 64 54 56 50 C64 46 68 48 76 50Z" fill="url(#pragya-gold)" opacity="0.8" />
    </g>
  </g>

  <!-- Central Sanctum -->
  <circle cx="50" cy="50" r="14" stroke="url(#pragya-gold)" stroke-width="1.5" fill="#090d16" />

  <!-- The Flame of Pragya (Wisdom) -->
  <path d="M50 38 C53.5 43 55 46.5 55 50 C55 53 53 55.5 50 55.5 C47 55.5 45 53 45 50 C45 46.5 46.5 43 50 38Z" fill="url(#pragya-flame)" />
  <circle cx="50" cy="50" r="1.2" fill="#ffffff" />
</svg>
